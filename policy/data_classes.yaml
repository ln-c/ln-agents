# Grounding (G) classification. Unknown blocks cloud; derived artifacts inherit the most
# restrictive class of their inputs.
version: 1
inherit: most_restrictive
order: [public, internal, confidential, restricted, unknown]
classes:
  public:       {cloud_allowed: true}
  internal:     {cloud_allowed: true}
  confidential: {cloud_allowed: false}
  restricted:   {cloud_allowed: false}
  unknown:      {cloud_allowed: false}

# Grounding (G) classification by artifact role. Production code stays confidential and never
# leaves the host; specs, contracts, and the context manifest may reach cloud design
# stages. An artifact missing here is `unknown` (cloud blocked). An entry spec's declared
# classification can only RAISE `requirements`.
# Derived artifacts (the file index) inherit the most restrictive class of their inputs.
# The one exception is pinned_context_manifest: schemas/context_manifest.schema.json fixes
# its fields (ids, hashes, versions, paths, statuses), so it cannot carry file contents
# and is classified by this map, not by the source tree it was computed from.
artifact_defaults:
  pinned_source_tree:       confidential
  protected_tests:          confidential
  applicable_contracts:     internal      # shared default for other users: confidential
  requirements:             internal
  pinned_snapshot:          internal
  pinned_context_manifest:  internal

# Classes of single files, for the MCP server (docs/reference/mcp.md, "Path rules"). The first
# rule that covers a file gives it its class; a file no rule covers keeps the class of its
# artifact, so the code (src/, tests/, rust/, scripts/), .github/ and every file not listed
# here stay `confidential` and never leave the host. A rule here is this policy's own statement
# that those files may be sent to a cloud model: the documentation and the specifications that
# define the pipeline, which the repository publishes anyway. Paths are relative to the
# project root, with `/`; `**` is any number of directories. Only these top-level files are
# named; a new top-level file is confidential until a rule lists it.
path_rules:
  - {path: "README.md",       class: internal}
  - {path: "CONTRIBUTING.md", class: internal}
  - {path: "AGENTS.md",       class: internal}
  - {path: "CLAUDE.md",       class: internal}
  - {path: "LN-AGENTS.md",    class: internal}
  - {path: "LICENSE",         class: internal}
  - {path: "docs/**",         class: internal}
  - {path: "schemas/**",      class: internal}
  - {path: "agents/**",       class: internal}
  - {path: "pipeline/**",     class: internal}
  - {path: "policy/**",       class: internal}

# Where a proposal's declared data flows may go. `cloud: true` means the destination is
# outside the host and the organization's own services; B1's data_class_violation veto then
# requires the flow's data class to be cloud_allowed. A destination kind not listed here is
# undetermined, never clear. The kinds must match schemas/proposal.schema.json.
destinations:
  local:            {cloud: false}
  internal_service: {cloud: false}
  cloud_service:    {cloud: true}
  third_party:      {cloud: true}
