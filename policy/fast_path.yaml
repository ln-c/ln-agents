# B3 authorization: the fast path skips design approval ONLY (E2 and F1 always run).
# All requirements must hold. Which items belong here is a calibration question: change it here.
version: 1
task_class_allowlist: []   # empty = fast path disabled until a human adds classes
require_all:
  - task_class_on_allowlist
  - no_active_veto
  - no_mandatory_approval
  - contracts_and_protected_tests_intact
  - no_unresolved_material_exception
  - no_near_tie
  - no_high_uncertainty
  - no_security_tag
  - no_new_dependency          # (proposed)
  - no_cross_service_boundary  # (proposed)
