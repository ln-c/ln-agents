#   - id: GHSA-xxxx-xxxx-xxxx
#     severity: critical            # critical | high | moderate | low; only critical vetoes
#     affected:
#       - package: {ecosystem: PyPI, name: example}
#         ranges: [{type: ECOSYSTEM, events: [{introduced: "0"}, {fixed: "1.2.3"}]}]
#         versions: []              # optional explicit affected versions
