# Logical model/access registry for agentic-pipeline.
# This file assigns execution backends; it does not grant permissions or authorize transitions.
# A model is bound only here: `agents.*.primary` then `model_assistance` (in preference order).
# stage_requirements names none; its candidate backends are derived from the agent.
# Resolve aliases to the exact supported tool/model version at runtime and record that resolution.
version: 1
registry_name: agentic-pipeline-budget

policy:
  subscription_only: true
  allow_paid_api_billing: false
  allow_clefflash_free_allowance: true
  allow_unapproved_provider_fallback: false
  on_quota_exhaustion: pause_or_approved_local_fallback
  record_resolved_model_and_access_path: true
  record_usage_or_quota_status: true
  model_output_is_untrusted: true
  # Presence of any of these (even empty) blocks every dispatch. The schema
  # enforces this list as a floor; entries may be added, never removed.
  prohibited_credential_env_vars:
    - ANTHROPIC_API_KEY
    - ANTHROPIC_AUTH_TOKEN
    - CLAUDE_CODE_USE_BEDROCK
    - CLAUDE_CODE_USE_VERTEX
    - GEMINI_API_KEY
    - GOOGLE_API_KEY
    - GOOGLE_APPLICATION_CREDENTIALS
    - GOOGLE_GENAI_USE_VERTEXAI
  # Child processes receive an allowlisted environment, not the dispatcher's.
  child_process_env: allowlist_only

# A provider is an access path (how the pipeline reaches a model); a model is bound in `models`
# below. `location` says whether a provider's traffic leaves the host; dispatch applies
# policy/data_classes.yaml to anything that is not `local`. Every model provider lists
# `family_patterns`: ordered regexes over a model id, and every model of that provider must
# declare the family its id matches (an id that matches none is an error). A provider that can
# serve several families (agy, a llama.cpp server) cannot have a model catalogued under the wrong one.
providers:
  claude_pro:
    access_mode: subscription_tool
    location: cloud
    family_patterns:
      - {pattern: '^cli-default$', family: claude}
      - {pattern: '^claude-', family: claude}
    subscription: Claude Pro
    api_billing_allowed: false
    readiness:
      executable: claude
      version_pattern: '^(\d+)\.(\d+)\.(\d+) \(Claude Code\)$'
      min_version: [2, 1, 0]
  google_ai_pro:
    access_mode: subscription_tool
    location: cloud
    family_patterns:
      - {pattern: '^gemini-', family: gemini}
      - {pattern: '^claude-', family: claude}
      - {pattern: '^gpt-oss', family: gpt_oss}
    subscription: Google AI Pro
    api_billing_allowed: false
    # agy also offers non-Google models (it lists Claude and GPT-OSS), so independent design
    # needs Design B bound to a model whose declared family is not Claude's.
    readiness:
      executable: agy
      version_pattern: '^(\d+)\.(\d+)\.(\d+)$'
      min_version: [1, 3, 1]
  # llama.cpp's llama-server on loopback, one process per model (`model_id` is the server's
  # --alias). `launch` is how dispatch starts it when a stage needs it and it is not running,
  # and stops it after the stage (R19: it must bind the host and port readiness checks).
  # `-dev Vulkan0` matters: when ggml-openvino is installed a bare llama-server picks the
  # OpenVINO CPU backend instead.
  llamacpp_local:
    access_mode: local_inference
    location: local
    family_patterns:
      - {pattern: '^qwen3\.5', family: qwen3_5}
    network_required: false
    api_billing_allowed: false
    readiness:
      protocol: llamacpp
      host: 127.0.0.1
      port: 8080
      timeout_seconds: 1.0
    launch:
      argv: [llama-server, -m, ~/models/gguf/Qwen3.5-9B-Q4_K_M.gguf, --alias, qwen3.5-9b,
             --host, 127.0.0.1, --port, "8080", -dev, Vulkan0, -ngl, "99", -c, "16384",
             --jinja, --parallel, "1"]
      ready_timeout_seconds: 120
  # A second llama-server for decision models (Clef-Flash), which answer only on /v1/systemone:
  # one probability per question option from a single forward pass, no generated text. The
  # whole request must fit one physical batch, and the probabilities shift slightly with -b/-ub,
  # so it starts with exactly these flags (the server does not report -b/-ub, so nothing else
  # checks them). A2J requests reach about 6k tokens, so the batch is 8192 (4096 refused a
  # 5,779-token finding on 2026-10-18); policy/triage.yaml's threshold was recalibrated at
  # 8192 on 2026-10-18.
  llamacpp_decision:
    access_mode: local_inference
    location: local
    family_patterns:
      - {pattern: '^clef', family: clef}
    network_required: false
    api_billing_allowed: false
    readiness:
      protocol: llamacpp
      host: 127.0.0.1
      port: 8081
      timeout_seconds: 1.0
    launch:
      argv: [llama-server, -m, ~/models/gguf/Clef-Flash-Q4_K_M.gguf, --alias, clef-flash,
             --host, 127.0.0.1, --port, "8081", -dev, Vulkan0, -ngl, "99", -c, "16384",
             -b, "8192", -ub, "8192", --parallel, "1"]
      ready_timeout_seconds: 90
  # OpenVINO Model Server on loopback (Intel CPU/GPU/NPU). It serves an OpenAI-compatible API
  # under /v3, which the broker reaches by rewriting the sandbox's /v1 path on the host. OVMS
  # reports no build digest, so a model's provenance records "no build digest reported".
  openvino_local:
    access_mode: local_inference
    location: local
    family_patterns:
      - {pattern: '^OpenVINO/Qwen3-', family: qwen3}
      - {pattern: '^meossistant/clef-flash', family: clef}
    network_required: false
    api_billing_allowed: false
    readiness:
      protocol: ovms
      host: 127.0.0.1
      port: 8000
      timeout_seconds: 1.0
  clef_flash_free:
    access_mode: free_allowance_only
    location: cloud
    family_patterns:
      - {pattern: '^clef', family: clef}
    api_billing_allowed: false
    optional: true
    quota_exhaustion: disable_and_use_deterministic_rule_or_pause
  deterministic_rules:
    access_mode: local_code
    location: local
    api_billing_allowed: false
  deterministic_ci_git_policy:
    access_mode: local_or_ci_tools
    location: local
    api_billing_allowed: false
  deterministic_orchestrator:
    access_mode: repository_runtime
    location: local
    api_billing_allowed: false
  local_ledger_and_deterministic_metrics:
    access_mode: local_code_and_storage
    location: local
    api_billing_allowed: false
  human_approval_ui_and_deterministic_state_machine:
    access_mode: human_interface_and_repository_runtime
    location: local
    api_billing_allowed: false

# The model catalog. Each entry is one model a provider can serve: `family` is what design
# independence is judged on, and `capabilities` are what is claimed it can do (declared, not
# measured; see policy/model_test_profiles.yaml). An empty `capabilities` list is a known model
# nobody has claimed anything for: it cannot be bound to any operation until someone does.
# Roles bind to these ids in `agents` below, so changing a model is a one-line change there.
models:
  claude_cli_default:
    provider: claude_pro
    model_id: cli-default  # whatever the claude CLI resolves; the CLI takes no model flag here
    alias: Claude (CLI default)
    family: claude
    capabilities: [code_generation, design_reasoning]
  # The same subscription CLI, pinned: `claude -p --model claude-opus-5-5 --effort high`.
  claude_opus_5_5_high_cli:
    provider: claude_pro
    model_id: claude-opus-5-5
    alias: Claude Opus 5.5 (High effort, claude CLI)
    family: claude
    effort: high
    capabilities: [design_reasoning]
  # Qwen3.5 thinks by default, which spends the token budget before any answer on this laptop
  # (about 15 tokens/s); `chat_template_kwargs` are merged into every request the broker forwards
  # and win over the sandbox's own values. Qwen3.5 is its own family here: a different
  # architecture from Qwen3, though from the same lab.
  qwen3_5_9b:
    provider: llamacpp_local
    model_id: qwen3.5-9b
    alias: Qwen3.5 9B
    family: qwen3_5
    capabilities: [classification, code_generation]
    chat_template_kwargs: {enable_thinking: false}
  clef_flash:
    provider: clef_flash_free
    model_id: clef-flash
    alias: Clef-flash
    family: clef
    capabilities: [classification]
  # Cloudflare's Clef-Flash (post-trained from Qwen3.5-9B) on the local decision server: the A2J
  # finding judge. Its family differs from both design families, so it judges neither its own
  # proposal nor its own critique.
  clef_flash_local:
    provider: llamacpp_decision
    model_id: clef-flash
    alias: Clef-Flash (llama.cpp)
    family: clef
    capabilities: [decision]
  # Served by OpenVINO Model Server under the Hugging Face repo name (the models in the local
  # Hugging Face cache). No capabilities are claimed yet: `models test` needs a bound role to
  # derive its checks from, so claim some, or bind one, before testing it.
  openvino_qwen3_8b_int4_cw: {provider: openvino_local, model_id: "OpenVINO/Qwen3-8B-int4-cw-ov", alias: "Qwen3 8B int4 (channel-wise, OpenVINO)", family: qwen3, capabilities: []}
  openvino_qwen3_1_7b_int4: {provider: openvino_local, model_id: "OpenVINO/Qwen3-1.7B-int4-ov", alias: "Qwen3 1.7B int4 (OpenVINO)", family: qwen3, capabilities: []}
  openvino_qwen3_0_6b_int4: {provider: openvino_local, model_id: "OpenVINO/Qwen3-0.6B-int4-ov", alias: "Qwen3 0.6B int4 (OpenVINO)", family: qwen3, capabilities: []}
  openvino_clef_flash: {provider: openvino_local, model_id: "meossistant/clef-flash-openvino", alias: "Clef-flash (OpenVINO)", family: clef, capabilities: []}
  # Everything `agy models` offered when this catalog was written (13 ids). Only the ones with
  # claimed capabilities can be bound; the rest are known, unclaimed, unbindable. Gemini 4 Argon
  # (Medium) and GPT-OSS 120B (Medium) were claimed for design without running `models test`.
  gemini_4_argon_medium: {provider: google_ai_pro, model_id: gemini-4-argon-medium, alias: "Gemini 4 Argon (Medium)", family: gemini, capabilities: [design_reasoning]}
  gemini_4_argon_high: {provider: google_ai_pro, model_id: gemini-4-argon-high, alias: "Gemini 4 Argon (High)", family: gemini, capabilities: []}
  gemini_4_argon_low: {provider: google_ai_pro, model_id: gemini-4-argon-low, alias: "Gemini 4 Argon (Low)", family: gemini, capabilities: []}
  gemini_3_8_flash_high: {provider: google_ai_pro, model_id: gemini-3.8-flash-high, alias: "Gemini 3.8 Flash (High)", family: gemini, capabilities: [code_generation, design_reasoning]}
  gemini_3_8_flash_medium: {provider: google_ai_pro, model_id: gemini-3.8-flash-medium, alias: "Gemini 3.8 Flash (Medium)", family: gemini, capabilities: []}
  gemini_3_8_flash_low: {provider: google_ai_pro, model_id: gemini-3.8-flash-low, alias: "Gemini 3.8 Flash (Low)", family: gemini, capabilities: []}
  claude_opus_5_5_low: {provider: google_ai_pro, model_id: claude-opus-5-5-low, alias: "Claude Opus 5.5 (Low)", family: claude, capabilities: []}
  claude_opus_5_5_medium: {provider: google_ai_pro, model_id: claude-opus-5-5-medium, alias: "Claude Opus 5.5 (Medium)", family: claude, capabilities: []}
  claude_opus_5_5_high: {provider: google_ai_pro, model_id: claude-opus-5-5-high, alias: "Claude Opus 5.5 (High)", family: claude, capabilities: []}
  claude_sonnet_5_5_low: {provider: google_ai_pro, model_id: claude-sonnet-5-5-low, alias: "Claude Sonnet 5.5 (Low)", family: claude, capabilities: []}
  claude_sonnet_5_5_medium: {provider: google_ai_pro, model_id: claude-sonnet-5-5-medium, alias: "Claude Sonnet 5.5 (Medium)", family: claude, capabilities: []}
  claude_sonnet_5_5_high: {provider: google_ai_pro, model_id: claude-sonnet-5-5-high, alias: "Claude Sonnet 5.5 (High)", family: claude, capabilities: []}
  gpt_oss_120b_medium: {provider: google_ai_pro, model_id: gpt-oss-120b-medium, alias: "GPT-OSS 120B (Medium)", family: gpt_oss, capabilities: [design_reasoning]}

agents:
  grounding:
    spec: agents/pipeline-grounding-agent.md
    primary: qwen3_5_9b
    escalation: claude_cli_default
    escalation_trigger: unresolved_ambiguity_or_insufficient_local_quality
    allowed_writes: [grounding_artifacts]
    may_change_state: false

  design:
    spec: agents/pipeline-design-agent.md
    # Per-operation read/write scopes live in stage_requirements (A1, A2, A3).
    # Each design side writes its proposal (A1) and critiques the other side's (A2).
    proposal_a:
      primary: claude_opus_5_5_high_cli
      isolation_group: design_a
    proposal_b:
      primary: gemini_4_argon_medium
      isolation_group: design_b
    # A2J: one decision call per critique finding, on the host's loopback only. Local, so no
    # data-class egress; if the server is down the run pauses (no fallback).
    finding_triage:
      primary: clef_flash_local
    # A third family (GPT-OSS, through agy) merges the two designs.
    synthesis:
      primary: deterministic_orchestrator
      model_assistance: [gpt_oss_120b_medium]
      requires_both_proposals_sealed: true
      unresolved_conflict_route: human_authority
    # Reviews and scores the validated synthesis. B2 only counts the scores if the reviewer's
    # family differs from the synthesizer's (GPT-OSS).
    synthesis_review:
      primary: deterministic_orchestrator
      model_assistance: [gemini_3_8_flash_high, claude_cli_default]

  scoring_authorization:
    primary: deterministic_rules
    policy_inputs:
      - policy/vetoes.yaml
      - policy/weights.yaml
      - policy/fast_path.yaml
      - policy/budgets.yaml
    may_change_policy: false
    may_authorize_own_policy_change: false

  build:
    spec: agents/pipeline-build-agent.md
    # graph E1: "Pi + the local build model". Cloud models reach build only through E3 -> E4.
    primary: qwen3_5_9b
    cloud_escalation: graph_e3_e4_only
    allowed_writes: [assigned_implementation_paths]
    protected_paths_write_denied: [tests, contracts, policy, budgets, approvals, release_state, pipeline/graph.yaml, schemas]
    escalation_requires_explicit_authorization: true

  exception_router:
    spec: agents/pipeline-exception-router.md
    primary: deterministic_rules
    optional_classifier: clef_flash
    classifier_role: bounded_classification_only
    may_change_policy: false
    may_authorize_security_override: false
    transition_executor: deterministic_orchestrator
    routing_policy: policy/routing.yaml
    retry_budget_policy: policy/budgets.yaml

  release:
    spec: agents/pipeline-release-agent.md
    primary: deterministic_ci_git_policy
    explanation_fallback: qwen3_5_9b
    cloud_explanation_fallback: claude_cli_default
    merge_approval_required: true
    deploy_approval_separate: true
    model_may_authorize_release: false

  learning:
    spec: agents/pipeline-learning-agent.md
    primary: local_ledger_and_deterministic_metrics
    analysis_fallback: qwen3_5_9b
    subscription_analysis: claude_cli_default
    index_update_condition: successful_merge_and_exact_merged_sha
    calibration_requires_human_review: true

  human_authority:
    spec: agents/pipeline-human-authority-agent.md
    primary: human_approval_ui_and_deterministic_state_machine
    model_assistance: [claude_cli_default, gemini_3_8_flash_high, qwen3_5_9b]
    approval_decider: human_only
    security_veto_override_by_model: false

execution:
  state_graph: pipeline/graph.yaml
  state_transition_executor: deterministic_orchestrator
  require_idempotency_key: true
  require_pinned_git_sha: true
  require_context_manifest_digest: true
  require_provenance_event: true
  retry_budget_owner: policy/budgets.yaml
  hard_veto_policy: policy/vetoes.yaml
  data_classification_policy: policy/data_classes.yaml
  escalation_policy: policy/escalation.yaml
  validate_structured_outputs: true
  enforce_filesystem_permissions_outside_model: true
  enforce_network_and_secret_policy_outside_model: true
  on_missing_or_conflicting_evidence: fail_closed
  # A dispatch failure with no graph edge (e.g. in A1-A3) pauses the run; it is
  # not a graph state and never routes to T-HALTED without a human at H1.
  on_unrouted_dispatch_failure: pause_run_pending_human

isolation:
  proposal_a_and_b_must_use_separate_sessions: true
  proposal_a_and_b_must_use_separate_write_roots: true
  proposal_b_can_read_proposal_a_before_seal: false
  same_backend_counts_as_cross_provider_independence: false
  isolation_failure_policy: mark_requirement_unmet_and_pause

budget:
  no_new_subscription: true
  paid_api_calls: forbidden
  use_local_for_routine_tasks: true
  use_cloud_subscription_for_high_value_escalations: true
  disable_optional_free_classifier_when_quota_unavailable: true
  no_silent_fallback: true
  # graph.yaml: an edge's budget is consumed each time the edge is taken. A stage
  # with several model invocations still consumes one unit per entering edge.
  retry_accounting: per_graph_edge

# Artifact catalog referenced by stage_requirements. `producer` is a graph state
# or `STATE.operation`; only sealed artifacts may cross an isolation boundary.
artifacts:
  requirements: {sealed: true, producer: [START]}
  pinned_source_tree: {sealed: true, producer: [G]}
  applicable_contracts: {sealed: true, producer: [G]}
  pinned_snapshot: {sealed: true, producer: [G]}
  protected_tests: {sealed: true, producer: [G]}
  pinned_context_manifest: {sealed: true, producer: [G]}
  proposal_a_scratch: {sealed: false, producer: [A1.proposal_a]}
  proposal_a_sealed: {sealed: true, producer: [A1.proposal_a]}
  proposal_b_scratch: {sealed: false, producer: [A1.proposal_b]}
  proposal_b_sealed: {sealed: true, producer: [A1.proposal_b]}
  critique_b_by_a_sealed: {sealed: true, producer: [A2.critique_b_by_a]}
  critique_a_by_b_sealed: {sealed: true, producer: [A2.critique_a_by_b]}
  finding_verdicts_sealed: {sealed: true, producer: [A2J.finding_verdicts]}
  synthesis_sealed: {sealed: true, producer: [A3.synthesis]}
  synthesis_review_sealed: {sealed: true, producer: [A3R.synthesis_review]}
  design_decision_sealed: {sealed: true, producer: [DR]}
  contracts_sealed: {sealed: true, producer: [C1.module_decomposition]}
  generated_tests_sealed: {sealed: true, producer: [D1.test_generation]}
  implementation_patch: {sealed: false, producer: [E1.implementation_patch]}

# Write roots, relative to the per-run root the orchestrator supplies at runtime.
# Roots must be distinct and must not nest.
workspace_roots:
  proposal_a: design/proposal_a
  proposal_b: design/proposal_b
  critique_b_by_a: design/critique_b_by_a
  critique_a_by_b: design/critique_a_by_b
  finding_verdicts: design/finding_verdicts
  synthesis: design/synthesis
  synthesis_review: design/synthesis_review
  contracts: build/contracts
  generated_tests: build/generated_tests
  implementation_patch: build/implementation_patch

# Runtime checks each profile requires; any check not VERIFIED blocks dispatch.
isolation_profiles:
  independent_proposals: [proposal_path_layout, sandbox_enforcement, session_separation]
  independent_cross_critique: [proposal_path_layout, sandbox_enforcement, session_separation, sealed_input_verification]
  sealed_inputs_only: [sandbox_enforcement, sealed_input_verification]
  # A decision call runs no process and has no tools: the model sees only the request text.
  decision_local: [sealed_input_verification]
  implementation_sandbox: [sandbox_enforcement, sealed_input_verification, protected_paths_read_only, network_disabled, broker_mediated_inference]

# One entry per graph state whose executor includes `model`. `output_schema` (optional)
# names a schemas/<name>.schema.json: the operation must reply with one JSON object of
# that shape, which the adapter writes as <operation_id>.json for the deterministic gates. Reads are
# default-deny: only `allowed_reads` are supplied. `denied_reads` are explicit
# assertions the validator checks are disjoint from `allowed_reads`.
stage_requirements:
  A1:
    mode: all_of
    operations:
      - id: proposal_a
        agent: design.proposal_a
        role: proposal_author
        requires: [design_reasoning]
        allowed_reads: [pinned_context_manifest, requirements, applicable_contracts]
        denied_reads: [proposal_b_scratch, proposal_b_sealed]
        write_root: proposal_a
        isolation_profile: independent_proposals
        output_schema: proposal
      - id: proposal_b
        agent: design.proposal_b
        role: proposal_author
        requires: [design_reasoning]
        allowed_reads: [pinned_context_manifest, requirements, applicable_contracts]
        denied_reads: [proposal_a_scratch, proposal_a_sealed]
        write_root: proposal_b
        isolation_profile: independent_proposals
        output_schema: proposal
  A2:
    mode: all_of
    operations:
      # Model A critiques only Proposal B; Model B critiques only Proposal A.
      - id: critique_b_by_a
        agent: design.proposal_a
        role: cross_reviewer
        requires: [design_reasoning]
        target_artifact: proposal_b_sealed
        allowed_reads: [pinned_context_manifest, proposal_b_sealed]
        denied_reads: [proposal_b_scratch, critique_a_by_b_sealed]
        write_root: critique_b_by_a
        isolation_profile: independent_cross_critique
        output_schema: critique
      - id: critique_a_by_b
        agent: design.proposal_b
        role: cross_reviewer
        requires: [design_reasoning]
        target_artifact: proposal_a_sealed
        allowed_reads: [pinned_context_manifest, proposal_a_sealed]
        denied_reads: [proposal_a_scratch, critique_b_by_a_sealed]
        write_root: critique_a_by_b
        isolation_profile: independent_cross_critique
        output_schema: critique
  A2J:
    mode: ordered_any_of
    operations:
      - id: finding_verdicts
        agent: design.finding_triage
        role: finding_judge
        requires: [decision]
        allowed_reads:
          - proposal_a_sealed
          - proposal_b_sealed
          - critique_a_by_b_sealed
          - critique_b_by_a_sealed
        denied_reads: [proposal_a_scratch, proposal_b_scratch]
        write_root: finding_verdicts
        isolation_profile: decision_local
        # No output_schema: that asks a text model for JSON. DecisionAdapter writes
        # finding_verdicts.json itself (schemas/decision_result.schema.json); A2J validates it.
  A3:
    mode: ordered_any_of
    operations:
      - id: synthesis
        agent: design.synthesis
        role: synthesizer
        requires: [design_reasoning]
        allowed_reads:
          - pinned_context_manifest
          - requirements
          - applicable_contracts
          - proposal_a_sealed
          - proposal_b_sealed
          - critique_a_by_b_sealed
          - critique_b_by_a_sealed
        denied_reads: [proposal_a_scratch, proposal_b_scratch]
        write_root: synthesis
        isolation_profile: sealed_inputs_only
        output_schema: proposal
  A3R:
    mode: ordered_any_of
    operations:
      - id: synthesis_review
        agent: design.synthesis_review
        role: synthesis_reviewer
        requires: [design_reasoning]
        target_artifact: synthesis_sealed
        allowed_reads: [pinned_context_manifest, synthesis_sealed]
        denied_reads: [proposal_a_scratch, proposal_b_scratch]
        write_root: synthesis_review
        isolation_profile: sealed_inputs_only
        output_schema: critique
  C1:
    mode: ordered_any_of
    operations:
      # Runs before E0 creates the implementation sandbox.
      - id: module_decomposition
        agent: build
        role: contract_author
        requires: [code_generation]
        allowed_reads: [pinned_context_manifest, design_decision_sealed, synthesis_sealed, pinned_source_tree, applicable_contracts]
