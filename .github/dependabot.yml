# Weekly update PRs for the pinned GitHub Actions and both lockfiles. A dependency change still
# goes through review and CI like any other PR (E2 also refuses one inside a pipeline patch).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /rust
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
