name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token; no job needs to write. Actions are pinned to commit SHAs (Dependabot keeps
# them current), checkout keeps no credentials, and a newer push to a PR cancels the older run.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      # uv sync would otherwise follow .python-version (3.14) in the 3.13 job too.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Set up the bwrap sandbox
        # The sandbox tests need user namespaces; recent Ubuntu images restrict them with AppArmor.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Check linting and formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run test suite
        run: uv run pytest

      - name: Validate pipeline graph invariants
        run: uv run python -m agentic_pipeline validate

  portable:
    # The control plane (runner, gates, approvals, provenance) must work on Windows and macOS.
    # No bwrap there, so the sandbox tests skip and model stages stay blocked by readiness.
    name: portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.UV_PYTHON }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run test suite
        run: uv run pytest

      - name: Validate pipeline graph invariants
        run: uv run python -m agentic_pipeline validate

  rust:
    # ln-hub must build and pass on every OS it ships for; the toolchain is pinned in
    # rust/rust-toolchain.toml.
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Release build and binary size
        run: |
          cargo build --release --locked
          ls -l target/release/ln-hub target/release/ln-hub.exe 2>/dev/null || true
