name: CI

# CI runs on AppVeyor (appveyor.yml, ci/). This workflow is kept for when GitHub Actions is
# available again and runs only by hand; restore the push and pull_request triggers to use it.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Set up the bwrap sandbox
        # The sandbox tests need user namespaces; recent Ubuntu images restrict them with AppArmor.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Check linting and formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run test suite
        run: uv run pytest

      - name: Validate pipeline graph invariants
        run: uv run python -m agentic_pipeline validate

  portable:
    # The control plane (runner, gates, approvals, provenance) must work on Windows and macOS.
    # No bwrap there, so the sandbox tests skip and model stages stay blocked by readiness.
    name: portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run test suite
        run: uv run pytest

      - name: Validate pipeline graph invariants
        run: uv run python -m agentic_pipeline validate

  rust:
    # ln-hub must build and pass on every OS it ships for; the toolchain is pinned in
    # rust/rust-toolchain.toml.
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Release build and binary size
        run: |
          cargo build --release --locked
          ls -l target/release/ln-hub target/release/ln-hub.exe 2>/dev/null || true
