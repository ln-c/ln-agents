name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Set up the bwrap sandbox
        # The sandbox tests need user namespaces; recent Ubuntu images restrict them with AppArmor.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-all --ro-bind /usr /usr --symlink usr/bin /bin --proc /proc --dev /dev true

      - name: Check linting and formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run test suite
        run: uv run pytest

      - name: Validate pipeline graph invariants
        run: uv run python -m agentic_pipeline validate
