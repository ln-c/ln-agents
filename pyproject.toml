[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "agentic-pipeline"
version = "0.1.0"
description = "Spec, policy, and invariant checks for agentic delivery pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "fastjsonschema>=2.20",
    "packaging>=24.0",
]

[project.scripts]
agentic-pipeline = "agentic_pipeline.cli:main"

[dependency-groups]
dev = [
    "mutmut>=3.8.0",
    "pymcdc>=0.2.6",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = ["S101"]  # allow assert in tests / checks

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mutmut]
source_paths = ["src/agentic_pipeline"]
pytest_add_cli_args_test_selection = ["tests"]
also_copy = ["tests", "scripts", "policy", "pipeline", "schemas", "agents", "docs"]
# sandbox_entry.py runs under the system python inside bwrap, where mutmut's trampoline
# (which imports mutmut) cannot load.
do_not_mutate = ["src/agentic_pipeline/sandbox_entry.py"]
